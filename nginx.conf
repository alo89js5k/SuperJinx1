map $http_upgrade $conn_up { default upgrade; '' close; }
server {
  listen 8080 reuseport;
  include /etc/nginx/jinx-port.inc;
  tcp_nodelay on;
  proxy_buffering off;
  proxy_request_buffering off;
  # healthcheck goes through to the real panel, so a broken panel = failed deploy (not a silent bug)
  location = /health { access_log off; proxy_pass http://127.0.0.1:8000/dashboard/; }
  location = / { return 302 /dashboard/; }

  # ⚡ Super JinX responsive skin for the dashboard (desktop + mobile)
  location = /jinx.css { alias /opt/jinx/jinx.css; default_type text/css; add_header Cache-Control "no-cache"; }
  location = /jinx.js  { alias /opt/jinx/jinx.js;  default_type application/javascript; add_header Cache-Control "no-cache"; }
  # 💎 donation page (حمایت مالی). Addresses live only in donate-config.js
  location = /donate { return 301 /donate/; }
  location = /donate/ { alias /opt/jinx/donate.html; default_type text/html; charset utf-8; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy no-referrer; }
  location = /donate/config.js { alias /opt/jinx/donate-config.js; default_type application/javascript; charset utf-8; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; }
  location /jinx-fonts/ { alias /opt/jinx/fonts/; types { font/woff2 woff2; } add_header Cache-Control "public, max-age=31536000"; }
  location /dashboard/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7c5cff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="/jinx.css?v=2"><script src="/jinx.js?v=2"></script></head>';
  }
  # 🔗 the panel's GitHub button / footer link -> Super JinX GitHub (only these two links change, nothing else)
  location /dashboard/assets/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_set_header If-None-Match "";          # always a fresh, rewritten copy (old cached copies are replaced)
    proxy_set_header If-Modified-Since "";
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    add_header Cache-Control "public, max-age=86400";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"https://github.com/Gozargah/Marzban"' '"https://github.com/x4gpanell"';
    sub_filter '"https://github.com/Gozargah"' '"https://github.com/x4gpanell"';
  }
  location /vless    { proxy_pass http://127.0.0.1:2001; include /etc/nginx/ws.inc; }
  location /vmess    { proxy_pass http://127.0.0.1:2002; include /etc/nginx/ws.inc; }
  location /trojan   { proxy_pass http://127.0.0.1:2003; include /etc/nginx/ws.inc; }
  location /panel-ws { proxy_pass http://127.0.0.1:2004; include /etc/nginx/ws.inc; }
  # ⚡ fast transports (only active when lock.py enabled them for this Xray version)
  location /vhu      { proxy_pass http://127.0.0.1:2005; include /etc/nginx/ws.inc; }
  location /vxh {
    proxy_pass http://127.0.0.1:2006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_socket_keepalive on;
    client_max_body_size 0;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # ⚡ account service (change admin username/password)
  location /jinx-api/ {
    proxy_pass http://127.0.0.1:8090;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
  }

  # 🤝 reseller panels: only these calls pass through the limit gate (login, create / edit / delete / reset user)
  #    if the gate is ever down, nginx sends the request straight to the panel, so login never breaks
  location = /api/admin/token { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; }
  location = /api/user        { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; }
  location ~ ^/api/user/[^/]+(/reset)?$ { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; }
  location @panel_direct {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Core config is read-only from the panel (protects the locked inbound)
  location = /api/core/config {
    if ($request_method != GET) { return 403; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # dashboard live logs (websocket)
    proxy_set_header Connection $conn_up;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
